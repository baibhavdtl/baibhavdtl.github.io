<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baibhav Dhital</title>
<meta name="description" content="Baibhav Dhital, high school graduate from St. Xavier’s College, Maitighar. Research and music videos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --panel:#E1E6F2; --ink:#1B2338; --mute:#58627F;
  --line:#C9D1E3; --accent:#3B4FE0;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.6}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:960px;margin:0 auto;padding:0 1.5rem}

/* intro */
.hero{padding:5rem 0 4rem}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(3.6rem,11vw,8rem);line-height:.92;letter-spacing:-.02em;margin:0 0 1.75rem}
.bio{font-size:1.3rem;max-width:38rem;margin:0 0 2rem}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:.8rem 1.5rem;border-radius:999px;text-decoration:none;font-weight:500}
.btn:hover{background:var(--ink);color:#fff}

/* talent */
.talent{border-top:1px solid var(--line);padding:3rem 0 5rem}
h2{font-family:var(--serif);font-weight:400;font-size:2.2rem;line-height:1.1;margin:0 0 1.75rem}
.videos{display:grid;grid-template-columns:1fr 1fr;gap:1.75rem 1.5rem}
.videos figure{margin:0}
.videos figure:first-child{grid-column:1 / -1}
.frame{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--panel);display:grid;place-items:center;color:var(--mute);font-size:.95rem}
.frame iframe{width:100%;height:100%;border:0}
.videos figure:first-child .frame{box-shadow:0 0 0 3px var(--accent)}
figcaption{margin-top:.6rem}
figcaption b{display:block}
figcaption span{color:var(--mute);font-size:.95rem}
.videos figure:first-child figcaption b{font-family:var(--serif);font-weight:400;font-size:1.7rem;line-height:1.15}

@media (max-width:700px){
  .hero{padding:2.5rem 0 3rem}
  .videos{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

<header class="hero">
  <h1>Baibhav Dhital</h1>
  <p class="bio">I’m a high school graduate from St. Xavier’s College, Maitighar, in Nepal. I’m interested in machine learning and building software. I like public speaking and also making music in my free time.</p>
  <a class="btn" href="https://github.com/baibhavdtl/baibhavdtl.github.io/blob/main/Paper_Main.pdf" target="_blank" rel="noopener">View research PDF</a>
</header>

<main>
<section class="talent" id="talent">
  <h2>Talent</h2>
  <div class="videos" id="music-list"></div>
</section>
</main>

</div>

<script>
/* ---- Edit your videos here. Paste the YouTube ID (the part after v=) into id. ----
   1st entry = the big featured video. 2nd and 3rd = the two smaller ones below it. */
const music = [
  {id:"JZ7w6EQ8QvQ", title:"Featured video", note:""},
  {id:"r4wnIPwp-kU", title:"Video", note:""},
  {id:"PLAYLIST:PLf-k_L96mtce5zKW5mYKWZnYwRm-IPmZJ", title:"Video playlist", note:""}
];

document.getElementById("music-list").innerHTML = music.map(function(v){
  var isPlaylist = v.id.startsWith("PLAYLIST:");
  var listId = isPlaylist ? v.id.slice("PLAYLIST:".length) : "";
  var embedUrl = isPlaylist
    ? "https://www.youtube.com/embed?listType=playlist&list=" + listId
    : "https://www.youtube-nocookie.com/embed/" + v.id;
  var watchUrl = isPlaylist
    ? "https://www.youtube.com/playlist?list=" + listId
    : "https://www.youtube.com/watch?v=" + v.id;
  var inner = '<iframe src="' + embedUrl + '" title="' + v.title + '" loading="lazy" allowfullscreen></iframe>';
  return '<figure><div class="frame">' + inner + '</div><figcaption><b>' + v.title +
    '</b><span>' + v.note + ' <a href="' + watchUrl + '" target="_blank" rel="noopener">Watch on YouTube</a></span></figcaption></figure>';
}).join("");

</script>
</body>
</html>
